services:
  expressvpn:
    build:
      context: .
      dockerfile: Dockerfile.expressvpn
    image: local/expressvpn-scale:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /opt/expressvpn/var:rw,noexec,nosuid,size=64m
    environment:
      # Keep glibc allocator low-overhead in dense fleets.
      - MALLOC_ARENA_MAX=2
      # Example: pin each container to a single core (set per replica).
      # - CPU_AFFINITY=0
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.35
    restart: unless-stopped

    # Compose scale example:
    # docker compose -f docker-compose.expressvpn-scale.yml up -d --scale expressvpn=1000
